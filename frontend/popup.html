<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome (icon) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
    <title>GaMa</title>
  </head>

  <body>
    <!-- Header -->
    <div class="header-container">
      <div class="header-left">
        <img src="logo.png" alt="Extension Icon" class="header-icon" />
        <h2 class="header-title">CheckPost Extension</h2>
      </div>
      <span class="header-version">v1.1</span>
    </div>

    <!-- Toggle -->
    <div class="checkbox-container">
      <p id="statusHeader">Protection is able</p>

      <label class="toggle-wrapper">
        <input type="checkbox" id="toggleCheckBox" />
        <span class="slider"></span>

        <span class="icon-state">
          <span class="icon-off-shape"></span>
          <span class="icon-on-shape"></span>
        </span>
      </label>

      <p id="siteUrl">Loading...</p>
    </div>

    <hr />

    <!-- Scanner -->
    <h5>External Links Scanner</h5>

    <div id="loading">
      <div class="loader"></div>
      <div class="loading">Scanning</div>
    </div>

    <ul id="linkList"></ul>

    <button id="seeMoreBtn">See More</button>

    <div id="noLinksMessage" style="display: none">
      No external links found.
    </div>

    <!-- Banner -->
    <div class="banner">
      <div class="text">Protect your mobile device</div>
      <div class="icons">
        <i class="fa-brands fa-apple"></i>
        <i class="fa-brands fa-android"></i>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
